name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: RegressionApp-macOS
          - os: windows-latest
            artifact: RegressionApp-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build folder application
        run: >-
          python -m PyInstaller
          --noconfirm
          --windowed
          --onedir
          --name RegressionApp
          --paths .
          --collect-submodules regression_app
          --hidden-import regression_app.app
          --hidden-import regression_app.weighting_ui_patch
          --hidden-import regression_app.calibration_plot_patch
          --hidden-import regression_app.amr_validation
          --hidden-import regression_app.amr_ui_patch
          --hidden-import scipy.stats
          main.py

      - name: Self-test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist/RegressionApp/RegressionApp.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RegressionApp.app RegressionApp-macOS.zip

      - name: Zip Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          Regression App v0.4.11 - Windows
          Extract RegressionApp-Windows.zip completely, then run RegressionApp\RegressionApp.exe.
          No Python installation is required.
          Do not run the EXE from inside the ZIP or copy it away from _internal.
          "@ | Set-Content -Path "dist/README-WINDOWS.txt"
          Compress-Archive -Path "dist/RegressionApp" -DestinationPath "dist/RegressionApp-Windows.zip" -Force

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RegressionApp-macOS
          path: dist/RegressionApp-macOS.zip
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RegressionApp-Windows
          path: |
            dist/RegressionApp-Windows.zip
            dist/README-WINDOWS.txt
          if-no-files-found: error
